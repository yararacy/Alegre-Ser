name: Atualiza episódios do PodSer

# Lê o canal @Alegre-Ser no YouTube e, se houver episódio novo,
# adiciona sozinho no site (podser-data.json).

on:
  schedule:
    - cron: '0 9 * * *'   # todo dia às 09:00 UTC (~06:00 no horário de Brasília)
  workflow_dispatch:        # permite rodar manualmente pelo botão "Run workflow"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Atualizar lista de episódios a partir do YouTube
        run: python scripts/update_podser.py

      - name: Publicar se houver episódio novo
        run: |
          if [ -n "$(git status --porcelain podser-data.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add podser-data.json
            git commit -m "PodSer: atualiza episódios automaticamente"
            git push
          else
            echo "Sem episódios novos."
          fi
