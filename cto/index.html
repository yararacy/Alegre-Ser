*{box-sizing:border-box;}
body{ margin:0; background:var(--papel); color:var(--tinta);
  font-family:var(--f); font-weight:400; font-size:16.5px; line-height:1.7;
  -webkit-font-smoothing:antialiased; overflow-x:hidden; }
h1,h2,h3{ font-weight:900; letter-spacing:-.028em; line-height:1.1; margin:0; }
p{ margin:0 0 15px; } p:last-child{ margin-bottom:0; }
strong{ font-weight:900; }

/* ---------- céu de aquarela ---------- */
.ceu{ position:fixed; inset:0; overflow:hidden; z-index:-1; pointer-events:none; }
.aq{ position:absolute; border-radius:50%; filter:blur(64px); }
.a1{ width:620px; height:520px; background:rgba(34,156,178,.30);  top:-160px; right:-120px; }
.a2{ width:520px; height:460px; background:rgba(200,69,35,.20);   top:34%;   left:-180px; }
.a3{ width:600px; height:480px; background:rgba(150,44,114,.15);  bottom:-180px; right:-150px; }
.a4{ width:440px; height:380px; background:rgba(220,136,44,.22);  top:18%;   left:44%; }
/* em telas estreitas as manchas cobrem tudo e se somam — precisam ser mais lavadas */
@media (max-width:900px){ .aq{ opacity:.62; filter:blur(74px); } }
@media (max-width:620px){ .aq{ opacity:.44; filter:blur(82px); } }

.marca{ position:relative; aspect-ratio:194/46; flex-shrink:0; }
.marca i{ position:absolute; inset:0; display:block;
  -webkit-mask:var(--wordmark) no-repeat center/contain; mask:var(--wordmark) no-repeat center/contain; }
.marca i.p1{ background-color:currentColor; clip-path:inset(0 31.7% 0 0); }   /* Alegre- */
.marca i.p2{ background-color:var(--teal);  clip-path:inset(0 0 0 68.3%); }   /* Ser */
.esp{ display:block; background-color:currentColor; aspect-ratio:512/426;
  -webkit-mask:var(--espiral) no-repeat center/contain; mask:var(--espiral) no-repeat center/contain;
  pointer-events:none; flex-shrink:0; }

.env{ position:relative; max-width:var(--wrap); margin:0 auto; padding:0 54px; }

/* ---------- cabeçalho ---------- */
.cab{ display:flex; align-items:center; gap:22px; padding:34px 0 0; flex-wrap:wrap; }
.cab .marca{ width:120px; color:var(--tinta); }
.cli{ font-size:9.5px; font-weight:900; letter-spacing:.22em; text-transform:uppercase;
  color:var(--tinta3); line-height:1.55; }
nav{ margin-left:auto; display:flex; gap:6px; }
nav button{ font-family:var(--f); font-size:12.5px; color:var(--tinta2); background:transparent;
  border:none; padding:9px 17px; border-radius:999px; cursor:pointer; transition:.16s; white-space:nowrap; }
nav button:hover{ background:rgba(255,255,255,.42); color:var(--tinta); }
nav button.on{ background:rgba(255,255,255,.72); color:var(--tinta); font-weight:900; }
button:focus-visible{ outline:2.5px solid var(--teal); outline-offset:3px; }

/* ---------- capa ---------- */
.capa{ padding:64px 0 6px; }
.olho{ font-size:10px; font-weight:900; letter-spacing:.26em; text-transform:uppercase;
  color:var(--quente); margin-bottom:20px; }
h1{ font-size:clamp(38px,5.8vw,62px); line-height:1.02; letter-spacing:-.032em; max-width:13ch; }
.risco{ width:214px; height:13px; margin-top:10px; display:block; }
.sub{ max-width:54ch; font-size:17px; line-height:1.7; color:var(--tinta2); margin:22px 0 0; }

/* ---------- corpo ---------- */
.corpo{ padding-bottom:100px; }
body[data-tema="alinhamento"] .corpo{ padding-bottom:140px; }
.secao{ margin-top:58px; }
.olho-d{ font-size:10px; font-weight:900; letter-spacing:.24em; text-transform:uppercase;
  color:var(--quente); margin-bottom:14px; display:flex; align-items:center; gap:9px; }
.olho-d .esp{ width:15px; color:var(--teal); }
h2{ font-size:clamp(25px,3.3vw,32px); margin-bottom:16px; }
.sec{ color:var(--tinta2); }
.mini{ font-size:15px; line-height:1.68; }
.texto{ max-width:66ch; }

.veu{ background:var(--veu); border-radius:44px 14px 44px 14px; padding:36px 40px; }
.veu.inv{ border-radius:14px 44px 14px 44px; }
.veu.leve{ background:var(--veu2); border-radius:34px 12px 34px 12px; }
.nota{ background:rgba(255,255,255,.5); border-left:3px solid var(--teal);
  border-radius:4px 22px 22px 4px; padding:22px 26px; font-size:15px; line-height:1.68;
  color:var(--tinta2); max-width:76ch; }
.nota strong{ color:var(--tinta); }

.bt{ font-family:var(--f); font-size:13px; font-weight:900; background:var(--tinta); color:var(--papel);
  border:none; padding:17px 30px; border-radius:999px; cursor:pointer; white-space:nowrap; transition:.18s; }
.bt:hover{ transform:translateY(-2px); }
.bt.claro{ background:rgba(255,255,255,.72); color:var(--tinta); }
.linha-bt{ display:flex; gap:12px; flex-wrap:wrap; margin-top:26px; }
.selo{ display:inline-block; font-size:9px; font-weight:900; letter-spacing:.18em; text-transform:uppercase;
  background:var(--teal); color:#fff; border-radius:999px; padding:5px 13px; margin-bottom:10px; }
.tag{ display:inline-block; font-size:9.5px; font-weight:900; letter-spacing:.16em; text-transform:uppercase;
  background:rgba(255,255,255,.6); color:var(--tinta3); border-radius:999px; padding:5px 13px;
  vertical-align:5px; margin-left:10px; }

/* ---------- o mapa ---------- */
.mapa{ position:relative; height:420px; margin:40px 0 8px; }
.mapa .cam{ position:absolute; inset:0; width:100%; height:100%; }
.est{ position:absolute; top:0; left:var(--bl); width:286px; }
.bolo{ position:absolute; top:var(--bt); left:18px; width:62px; height:62px; border-radius:50%;
  display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:900;
  color:#fff; background:rgba(44,36,29,.17); z-index:2; }
.est.aqui .bolo{ background:var(--teal); box-shadow:0 12px 30px -10px var(--teal); }
.curva{ display:none; }
.par{ position:absolute; top:236px; left:0; width:286px; }
.est:not(.aqui) .par{ opacity:.8; }
.par h3{ font-size:19px; line-height:1.24; margin:0 0 8px; letter-spacing:-.01em; }
.par p{ font-size:14px; line-height:1.64; color:var(--tinta2); margin:0; }

/* ---------- movimentos ---------- */
.cadeia{ margin-top:40px; }
.elo{ display:grid; grid-template-columns:92px 1fr; }
.elo .fio-e{ position:relative; }
.pt{ position:relative; z-index:2; width:36px; height:36px; border-radius:50%; background:var(--m);
  margin:5px auto 0; box-shadow:0 10px 26px -8px var(--m); }
.pt::after{ content:''; position:absolute; inset:-30px; border-radius:50%; background:var(--m);
  opacity:.14; filter:blur(24px); z-index:-1; }
.curva-e{ position:absolute; top:48px; left:0; width:100%; height:calc(100% - 48px); overflow:visible; }
.elo:last-child .curva-e{ display:none; }
.txt{ padding:0 0 46px 16px; max-width:62ch; }
.elo:last-child .txt{ padding-bottom:0; }
.txt h3{ font-size:20px; margin-bottom:9px; letter-spacing:-.018em; }
.txt p{ font-size:14.5px; line-height:1.68; color:var(--tinta2); margin:0; }

/* ---------- agenda ---------- */
.agenda{ position:relative; display:grid; grid-template-columns:auto 1fr; gap:34px 70px;
  margin-top:38px; align-items:start; }
.cal{ background:var(--veu2); border-radius:34px 12px 34px 12px; padding:28px 32px 30px; }
.cal-mes{ font-size:11px; font-weight:900; letter-spacing:.22em; text-transform:uppercase;
  color:var(--tinta2); margin-bottom:20px; }
.cal-sem, .cal-dias{ display:grid; grid-template-columns:repeat(7,46px); gap:3px; }
.cal-sem{ margin-bottom:6px; }
.cal-sem span{ text-align:center; font-size:9.5px; font-weight:900; letter-spacing:.1em; color:var(--tinta3); }
.dia{ position:relative; height:46px; display:flex; align-items:center; justify-content:center;
  font-size:14.5px; color:var(--tinta2); }
.dia.vazio{ visibility:hidden; }
.dia.marc{ font-weight:900; color:var(--mc); }
.dia .anel{ position:absolute; inset:-1px; overflow:visible; pointer-events:none; }

.marcas{ display:flex; flex-direction:column; gap:30px; padding-top:52px; }
.marcacao{ max-width:34ch; }
.marcacao .qdo{ font-size:10px; font-weight:900; letter-spacing:.2em; text-transform:uppercase;
  color:var(--mc); margin-bottom:6px; }
.marcacao h3{ font-size:18px; margin-bottom:5px; letter-spacing:-.018em; }
.marcacao p{ font-size:14px; line-height:1.62; color:var(--tinta2); margin:0; }
.ligacoes{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible; }

/* ---------- formulário ---------- */
.parte{ margin-top:52px; }
.parte-topo{ display:flex; align-items:center; gap:18px; margin-bottom:12px; }
.parte-n{ width:54px; height:54px; border-radius:50%; flex-shrink:0; background:var(--teal); color:#fff;
  display:flex; align-items:center; justify-content:center; font-size:21px; font-weight:900;
  box-shadow:0 12px 28px -12px var(--teal); }
.parte-rot{ font-size:9.5px; font-weight:900; letter-spacing:.24em; text-transform:uppercase;
  color:var(--tinta3); margin-bottom:3px; }
.parte-topo h2{ font-size:24px; margin:0; }
.dica{ font-size:14.5px; line-height:1.66; color:var(--tinta3); margin:0 0 24px 72px; max-width:60ch; }

.q{ margin-bottom:26px; } .q:last-child{ margin-bottom:0; }
.q-rot{ display:flex; gap:12px; font-size:15.5px; font-weight:900; line-height:1.5; margin-bottom:10px; }
.q-n{ color:var(--teal); flex-shrink:0; }
textarea, input[type=text]{ width:100%; font-family:var(--f); font-size:15.5px; color:var(--tinta);
  background:rgba(255,255,255,.72); border:1px solid var(--fio); border-radius:16px;
  padding:14px 17px; transition:.16s; }
textarea::placeholder, input::placeholder{ color:var(--tinta3); }
textarea{ min-height:92px; resize:vertical; line-height:1.64; overflow:hidden; display:block; }
textarea:focus, input[type=text]:focus{ outline:none; border-color:var(--teal); background:#fff;
  box-shadow:0 0 0 4px rgba(28,123,142,.1); }
.ident{ display:grid; grid-template-columns:1fr 1fr; gap:18px; }
.ident .q{ margin:0; } .ident .q.largo{ grid-column:1/-1; }

.tabela{ background:var(--veu2); border-radius:30px; overflow:hidden; margin-top:6px; }
.rolagem{ overflow-x:auto; }
table{ width:100%; border-collapse:collapse; font-size:14.5px; min-width:560px; }
th{ background:rgba(44,36,29,.05); color:var(--tinta2); text-align:left;
  font-size:10px; font-weight:900; letter-spacing:.16em; text-transform:uppercase; padding:16px 22px; }
td{ padding:10px 22px; border-top:1px solid var(--fio); vertical-align:middle;
  line-height:1.5; color:var(--tinta2); }
td input[type=text]{ border-radius:12px; padding:9px 13px; font-size:14.5px; }

.prog{ position:fixed; left:0; right:0; bottom:0; z-index:50; background:rgba(245,236,225,.92);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border-top:1px solid var(--fio); }
.prog-in{ max-width:var(--wrap); margin:0 auto; padding:13px 54px; display:flex; align-items:center; gap:18px; }
.trilho{ flex:1; height:7px; border-radius:999px; background:rgba(44,36,29,.11); overflow:hidden; min-width:60px; }
.trilho i{ display:block; height:100%; width:0; border-radius:999px; background:var(--teal); transition:width .4s ease; }
.conta{ font-size:12px; font-weight:900; color:var(--tinta3); white-space:nowrap; }
.aviso{ font-size:12.5px; color:var(--tinta3); }
.recibo{ font-size:12.5px; font-weight:900; color:var(--teal); margin-top:4px; }
.prog .bt{ padding:11px 24px; font-size:12.5px; }

      <td data-rot="Quando podem enviar"><input type="text" data-campo="mat_q_${i}" value="${esc(respostas['mat_q_'+i]||'')}"></td></tr>`;
  });
  h += `</tbody></table></div></div></div>

  <div class="parte">
    ${cabParte(2,'O retrato da liderança em números')}
    <p class="dica">Resposta rápida — número aproximado já serve.</p>
    <div class="tabela"><div class="rolagem"><table><tbody>`;
  NUMEROS.forEach((n,i)=>{
    h += `<tr><td style="width:52%">${esc(n)}</td><td><input type="text" data-campo="num_${i}" value="${esc(respostas['num_'+i]||'')}"></td></tr>`;
  });
  h += `</tbody></table></div></div></div>`;

  let n = 1;
  SECOES.forEach((sec,k)=>{
    const p = sec.titulo.split(' · ');
    h += `<div class="parte">${cabParte(p[0].replace('Parte ',''), p[1]||sec.titulo)}`;
    if(sec.hint) h += `<p class="dica">${esc(sec.hint)}</p>`;
    h += `<div class="veu leve${k%2?' inv':''}">`;
    sec.perguntas.forEach(q=>{
      h += `<div class="q"><div class="q-rot"><span class="q-n">${n}.</span><span>${esc(q)}</span></div>
        <textarea data-campo="p${n}">${esc(respostas['p'+n]||'')}</textarea></div>`;
      n++;
    });
    h += `</div></div>`;
  });

  h += `<div class="parte">
    ${cabParte(7,'Condições práticas')}
    <p class="dica">Isso define o desenho, o cronograma e o investimento da proposta.</p>
    <div class="tabela"><div class="rolagem"><table><tbody>`;
  CONDICOES.forEach((c,i)=>{
    h += `<tr><td style="width:52%">${esc(c)}</td><td><input type="text" data-campo="cond_${i}" value="${esc(respostas['cond_'+i]||'')}"></td></tr>`;
  });
  h += `</tbody></table></div></div></div>

  <div class="parte">
    ${cabParte(8,'Uma última pergunta')}
    <div class="veu leve">
      <div class="q"><div class="q-rot"><span class="q-n">18.</span><span>${esc(ULTIMA)}</span></div>
        <textarea data-campo="p18">${esc(respostas.p18||'')}</textarea></div>
    </div>
  </div>

  <div class="secao">
    <div class="veu inv">
      <h2>Terminaram?</h2>
      <p class="mini sec texto">É só enviar — as respostas vão direto para o Alegre-Ser, sem precisar sair daqui nem mandar e-mail. Se quiserem guardar uma cópia para vocês, dá para baixar o arquivo também.</p>
      <div class="linha-bt">
        <button class="bt" data-acao="enviar">Enviar respostas</button>
        <button class="bt claro" data-acao="baixar">Baixar uma cópia</button>
      </div>
      <div class="aviso" style="margin-top:16px;"></div>
      <div class="recibo" id="recibo"></div>
    </div>
  </div>`;
  return h;
}

function abaMateriais(){
  return `<div class="secao"><div class="nota">Esta área é alimentada conforme o programa acontece. Por enquanto, ainda não há material publicado.</div></div>
  <div class="secao" style="opacity:.74">
    <h2>Relatórios <span class="tag">Em breve</span></h2>
    <p class="sec mini texto">Relatórios agregados do processo. Respostas individuais de qualquer diagnóstico nunca aparecem aqui — só leituras do conjunto, sem identificação de pessoas.</p>
  </div>`;
}

/* encontros marcados — editar aqui para atualizar a agenda */
const MES = { ano:2026, mes:9, rotulo:'Setembro 2026' };
const ENCONTROS = [
  { dia:10, cor:'#C57A25', quando:'10 de setembro', titulo:'1ª reunião',
    texto:'Apresentação do Alegre-Ser.', estado:'feito' },
  { dia:18, cor:'#1C7B8E', quando:'18 de setembro', titulo:'2ª reunião',
    texto:'Alinhamento — leitura do formulário e desenho do programa.', estado:'proximo' }
];

function anel(cor, tracejado){
  return `<svg class="anel" viewBox="0 0 46 46" aria-hidden="true">
    <path d="M23,3.4 C33.6,3 42.8,11.4 42.6,23.2 C42.4,34.6 34,42.8 22.6,42.6
             C11.6,42.4 3.4,34 3.6,22.6 C3.8,11.6 12,3.6 23,3.4"
          fill="none" stroke="${cor}" stroke-width="2.2" stroke-linecap="round"
          ${tracejado ? 'stroke-dasharray="3 5"' : ''}/></svg>`;
}

function abaAgenda(){
  const prim = new Date(MES.ano, MES.mes-1, 1).getDay();
  const dias = new Date(MES.ano, MES.mes, 0).getDate();
  const porDia = {};
  ENCONTROS.forEach(e=> porDia[e.dia] = e);

  let cel = '';
  for(let i=0;i<prim;i++) cel += `<div class="dia vazio"></div>`;
  for(let d=1; d<=dias; d++){
    const e = porDia[d];
    cel += e
      ? `<div class="dia marc" data-dia="${d}" style="--mc:${e.cor}">${anel(e.cor, e.estado==='feito')}${d}</div>`
      : `<div class="dia">${d}</div>`;
  }

  const rot = ENCONTROS.map(e=>`
    <div class="marcacao" id="rot-${e.dia}" style="--mc:${e.cor}">
      <div class="qdo">${esc(e.quando)}${e.estado==='feito' ? ' · realizada' : ''}</div>
      <h3>${esc(e.titulo)}</h3>
      <p>${esc(e.texto)}</p>
    </div>`).join('');

  return `<div class="secao">
    <div class="olho-d"><span class="esp"></span>O movimento até aqui</div>
    <h2>Nossos encontros</h2>
    <div class="agenda" id="agenda">
      <svg class="ligacoes" id="ligacoes" aria-hidden="true"></svg>
      <div class="cal">
        <div class="cal-mes">${esc(MES.rotulo)}</div>
        <div class="cal-sem"><span>D</span><span>S</span><span>T</span><span>Q</span><span>Q</span><span>S</span><span>S</span></div>
        <div class="cal-dias">${cel}</div>
      </div>
      <div class="marcas">${rot}</div>
    </div>
  </div>
  <div class="secao">
    <div class="nota">Os próximos encontros entram aqui conforme forem sendo combinados.</div>
  </div>`;
}

/* liga cada data circulada ao seu rótulo com um pontilhado */
function ligacoes(){
  const wrap = document.getElementById('agenda');
  const svg  = document.getElementById('ligacoes');
  if(!wrap || !svg) return;
  const base = wrap.getBoundingClientRect();
  svg.setAttribute('viewBox', `0 0 ${base.width} ${base.height}`);
  svg.innerHTML = ENCONTROS.map(e=>{
    const c = wrap.querySelector(`[data-dia="${e.dia}"]`);
    const r = document.getElementById('rot-'+e.dia);
    if(!c || !r) return '';
    const a = c.getBoundingClientRect(), b = r.getBoundingClientRect();
    let d, fx, fy;
    if(b.top > a.bottom){            /* empilhado (celular): desce da data, sai do calendário e vai ao texto */
      const cal = wrap.querySelector('.cal').getBoundingClientRect();
      const x1 = a.left - base.left + a.width/2, y1 = a.bottom - base.top + 1;
      const yc = cal.bottom - base.top + 16;
      const x2 = b.left - base.left + 8, y2 = b.top - base.top + 6;
      const m  = Math.max(20,(y2-yc)/2);
      d = `M${x1},${y1} L${x1},${yc} C${x1},${yc+m} ${x2},${y2-m} ${x2},${y2}`; fx=x2; fy=y2;
    } else {                          /* lado a lado (desktop) */
      const x1 = a.right - base.left + 3, y1 = a.top - base.top + a.height/2;
      const x2 = b.left  - base.left - 12, y2 = b.top - base.top + 20;
      const dx = Math.max(40,(x2-x1)/2);
      d = `M${x1},${y1} C${x1+dx},${y1} ${x2-dx},${y2} ${x2},${y2}`; fx=x2; fy=y2;
    }
    return `<path d="${d}" fill="none" stroke="${e.cor}" stroke-width="1.8"
      stroke-linecap="round" stroke-dasharray="2 6" opacity=".75"/>
      <circle cx="${fx}" cy="${fy}" r="3.2" fill="${e.cor}"/>`;
  }).join('');
}

function barraProg(){
  return `<div class="prog"><div class="prog-in">
    <div class="trilho"><i id="cheio"></i></div>
    <div class="conta" id="conta"></div>
    <div class="aviso"></div>
    <button class="bt" data-acao="enviar">Enviar</button>
  </div></div>`;
}

/* lista ordenada {chave, rotulo, valor} — vira as colunas da planilha */
function montarCampos(){
  const C=[];
  const add=(chave,rotulo)=> C.push({chave, rotulo, valor: respostas[chave]||''});
  add('empresa','Empresa'); add('preenchido','Preenchido por'); add('data','Data');
  MATERIAIS.forEach((m,i)=>{ add('mat_s_'+i, 'P1 · '+m+' — situação');
                             add('mat_q_'+i, 'P1 · '+m+' — quando enviam'); });
  NUMEROS.forEach((n,i)=> add('num_'+i, 'P2 · '+n));
  let n=1;
  SECOES.forEach(sec=>{ sec.perguntas.forEach(q=>{ add('p'+n, n+'. '+q); n++; }); });
  CONDICOES.forEach((c,i)=> add('cond_'+i, 'P7 · '+c));
  add('p18','18. '+ULTIMA);
  return C;
}

function montarTexto(){
  const L=[];
  L.push('ALEGRE-SER · FORMULÁRIO DE ALINHAMENTO');
  L.push('Programa de Liderança Consciente · ' + CLIENTE);
  L.push('');
  L.push('Empresa: ' + (respostas.empresa||''));
  L.push('Preenchido por: ' + (respostas.preenchido||''));
  L.push('Data: ' + (respostas.data||''));
  L.push('');
  L.push('--- PARTE 1 · MATERIAIS ---');
  MATERIAIS.forEach((m,i)=> L.push(m + ' | situação: ' + (respostas['mat_s_'+i]||'—') + ' | envio: ' + (respostas['mat_q_'+i]||'—')));
  L.push('');
  L.push('--- PARTE 2 · NÚMEROS ---');
  NUMEROS.forEach((x,i)=> L.push(x + ': ' + (respostas['num_'+i]||'—')));
  L.push('');
  let n=1;
  SECOES.forEach(sec=>{
    L.push('--- ' + sec.titulo.toUpperCase() + ' ---');
    sec.perguntas.forEach(p=>{ L.push(n + '. ' + p); L.push('R: ' + (respostas['p'+n]||'—')); L.push(''); n++; });
  });
  L.push('--- PARTE 7 · CONDIÇÕES PRÁTICAS ---');
  CONDICOES.forEach((c,i)=> L.push(c + ': ' + (respostas['cond_'+i]||'—')));
  L.push('');
  L.push('--- PARTE 8 · UMA ÚLTIMA PERGUNTA ---');
  L.push('18. ' + ULTIMA);
  L.push('R: ' + (respostas.p18||'—'));
  return L.join('\n');
}

function baixar(){
  const blob = new Blob([montarTexto()], {type:'text/plain;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'Alinhamento_' + CLIENTE + '_AlegreSer.txt';
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },0);
  aviso('Arquivo gerado. Envie para a sua contato no Alegre-Ser.');
}
function copiar(){
  const t = montarTexto();
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(
      ()=>aviso('Copiado. Agora é só colar no e-mail.'),
      ()=>aviso('Não foi possível copiar neste navegador — use o botão de baixar.'));
  } else aviso('Não foi possível copiar neste navegador — use o botão de baixar.');
}
function aviso(m){ document.querySelectorAll('.aviso').forEach(e=> e.textContent = m); }

function quandoEnviado(){ try{ return localStorage.getItem(CHAVE+'_enviado'); }catch(e){ return null; } }
function marcarEnviado(){
  try{ localStorage.setItem(CHAVE+'_enviado', new Date().toISOString()); }catch(e){}
  const el = document.getElementById('recibo');
  if(el) el.textContent = 'Enviado em ' + new Date().toLocaleString('pt-BR',
    {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}) + '.';
}

/* envia por formulário + iframe escondido — atravessa onde o fetch não passa */
function enviarPorFormulario(corpo){
  return new Promise(resolve=>{
    let pronto = false;
    const nome = 'envio_' + Date.now();
    const ifr = document.createElement('iframe');
    ifr.name = nome; ifr.style.display = 'none';
    const f = document.createElement('form');
    f.method = 'POST'; f.action = ENVIO.url; f.target = nome; f.style.display = 'none';
    const c = document.createElement('input');
    c.type = 'hidden'; c.name = 'payload'; c.value = corpo;
    f.appendChild(c);
    const limpar = ok => {
      if(pronto) return; pronto = true;
      setTimeout(()=>{ try{ f.remove(); ifr.remove(); }catch(e){} }, 500);
      resolve(ok);
    };
    ifr.addEventListener('load', ()=> limpar(true));
    ifr.addEventListener('error', ()=> limpar(false));
    document.body.appendChild(ifr); document.body.appendChild(f);
    try{ f.submit(); }catch(e){ limpar(false); return; }
    setTimeout(()=> limpar(false), 20000);
  });
}

async function enviar(btn){
  if(!ENVIO.url){
    aviso('O envio ainda não foi ligado nesta sala. Baixe uma cópia e mande para a sua contato no Alegre-Ser.');
    return;
  }
  const rotulo = btn.textContent;
  btn.disabled = true; btn.textContent = 'Enviando…';
  aviso('');
  const carga = {
    cliente: CLIENTE,
    quando: new Date().toISOString(),
    segredo: ENVIO.segredo,
    campos: montarCampos(),
    texto: montarTexto()
  };
  const corpo = JSON.stringify(carga);
  const cab = {'Content-Type':'text/plain;charset=utf-8'};
  let estado = 'falhou';

  /* 1ª tentativa: fetch normal — quando dá certo, conseguimos ler a confirmação */
  try{
    const r = await fetch(ENVIO.url, {method:'POST', headers:cab, body:corpo, redirect:'follow'});
    if(r.ok){
      let j = null; try{ j = await r.json(); }catch(e){}
      estado = (!j || j.ok !== false) ? 'ok' : 'falhou';
    }
  }catch(e){ /* segue para o plano B */ }

  /* 2ª tentativa: formulário para um iframe escondido. Não é bloqueado por CORS
     e funciona até com a página aberta direto do computador (file://). */
  if(estado !== 'ok'){
    estado = await enviarPorFormulario(corpo) ? 'provavel' : 'falhou';
  }
  btn.disabled = false; btn.textContent = rotulo;

  if(estado === 'ok'){
    marcarEnviado();
    aviso('Recebemos. Suas respostas já estão com o Alegre-Ser.');
  } else if(estado === 'provavel'){
    marcarEnviado();
    aviso('Enviado. Se a gente não confirmar em um dia útil, baixe a cópia e nos mande.');
  } else {
    aviso('Não conseguimos enviar agora. Baixe uma cópia e mande para a sua contato no Alegre-Ser.');
  }
}

function render(){
  document.body.dataset.tema = state.aba;
  if(!state.unlocked){ app.innerHTML = telaSenha(); ligar(); return; }
  let miolo='';
  if(state.aba==='inicio') miolo=abaInicio();
  else if(state.aba==='programa') miolo=abaPrograma();
  else if(state.aba==='alinhamento') miolo=abaAlinhamento();
  else if(state.aba==='materiais') miolo=abaMateriais();
  else if(state.aba==='agenda') miolo=abaAgenda();
  app.innerHTML = `<div class="env">${topo()}<div class="corpo">${miolo}</div>`
    + `<footer><div class="esp"></div>Alegre-Ser · Expansão de Consciência · Metodologia JDL<br>alegre-ser.com.br</footer></div>`
    + (state.aba==='alinhamento' ? barraProg() : '');
  ligar();
  window.scrollTo({top:0, behavior:'instant'});
}

function crescer(el){ el.style.height='auto'; el.style.height=(el.scrollHeight+2)+'px'; }

function progresso(){
  const c = app.querySelectorAll('[data-campo]');
  if(!c.length) return;
  let ok=0; c.forEach(e=>{ if((e.value||'').trim()) ok++; });
  const b=document.getElementById('cheio'), n=document.getElementById('conta');
  if(b) b.style.width = Math.round(ok/c.length*100)+'%';
  if(n) n.textContent = ok + ' de ' + c.length + ' campos';
}

function ligar(){
  app.querySelectorAll('[data-aba]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.aba = el.dataset.aba; render(); });
  });

  const b = app.querySelector('[data-acao="entrar"]');
  if(b){
    const campo = document.getElementById('senha');
    const tentar = ()=>{
      if((campo.value||'').trim() === SENHA){ state.unlocked=true; state.erro=false; }
      else state.erro = true;
      render();
    };
    b.addEventListener('click', tentar);
    campo.addEventListener('keydown', e=>{ if(e.key==='Enter') tentar(); });
    campo.focus();
  }

  let t=null;
  app.querySelectorAll('[data-campo]').forEach(el=>{
    if(el.tagName==='TEXTAREA' && el.value) crescer(el);
    el.addEventListener('input', ()=>{
      if(el.tagName==='TEXTAREA') crescer(el);
      respostas[el.dataset.campo] = el.value;
      progresso();
      clearTimeout(t);
      t = setTimeout(()=>{
        aviso(guardar(respostas) ? 'Rascunho guardado neste navegador.'
                                 : 'Não foi possível guardar automaticamente — baixe o arquivo antes de fechar.');
      }, 600);
    });
  });
  progresso();

  document.querySelectorAll('[data-acao="baixar"]').forEach(x=> x.addEventListener('click', baixar));
  document.querySelectorAll('[data-acao="enviar"]').forEach(x=> x.addEventListener('click', ()=> enviar(x)));
  const rec = document.getElementById('recibo'), q = quandoEnviado();
  if(rec && q) rec.textContent = 'Enviado em ' + new Date(q).toLocaleString('pt-BR',
    {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}) + '.';

  if(state.aba === 'agenda'){ requestAnimationFrame(ligacoes); }
}

window.addEventListener('resize', ()=>{ if(state.aba==='agenda') ligacoes(); }, {passive:true});

render();
</script>
