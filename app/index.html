<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>App Alegre-Ser · em construção</title>
<style>
  :root{
    --teal:#229cb2; --teal-dark:#155E6B;
    --terracota:#c84523; --roxo:#962c72; --ambar:#E08030;
    --cream:#F5EFE0; --surface:#FCFCFB;
    --ink:#1B1B1B; --ink-muted:#5A5A5A;
    --good:#1E8F5F; --warn:#B8860B; --crit:#B23B3B;
    --line:#E5DFCE;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;
    display:flex; justify-content:center;
  }
  h1,h2,h3,.serif{ font-family:Georgia,'Iowan Old Style','Palatino Linotype',serif; }
  #app{ width:100%; max-width:720px; padding:28px 20px 60px; }
  .topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:22px; }
  .brand{ display:flex; align-items:center; gap:10px; }
  .logo-dot{ width:30px; height:30px; border-radius:50%; background:var(--teal-dark);
    display:flex; align-items:center; justify-content:center; color:#fff; font-size:14px; font-weight:600; }
  .brand-name{ font-family:Georgia,serif; font-size:17px; color:var(--teal-dark); }
  .tag{ font-size:11px; color:var(--ink-muted); letter-spacing:.04em; text-transform:uppercase; }

  .card{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:26px 24px; margin-bottom:16px; }
  .muted{ color:var(--ink-muted); }
  .small{ font-size:13px; }
  p{ line-height:1.55; }

  .progress-wrap{ margin-bottom:18px; }
  .progress-track{ height:6px; background:var(--line); border-radius:6px; overflow:hidden; }
  .progress-fill{ height:100%; background:var(--teal); transition:width .3s ease; }
  .progress-label{ font-size:12px; color:var(--ink-muted); margin-top:6px; display:flex; justify-content:space-between; }

  .btn{ display:inline-flex; align-items:center; gap:6px; border:none; border-radius:999px;
    padding:12px 22px; font-size:14.5px; font-weight:600; cursor:pointer; transition:opacity .15s ease; }
  .btn:hover{ opacity:.88; }
  .btn-primary{ background:var(--teal-dark); color:#fff; }
  .btn-ghost{ background:transparent; color:var(--teal-dark); border:1px solid var(--teal-dark); }
  .btn-text{ background:none; border:none; color:var(--ink-muted); text-decoration:underline; cursor:pointer; font-size:13px; padding:6px; }
  .btn[disabled]{ opacity:.4; cursor:not-allowed; }
  .btn-row{ display:flex; gap:10px; margin-top:22px; align-items:center; flex-wrap:wrap; }

  .module-eyebrow{ font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-muted); margin-bottom:6px; }
  .module-title{ font-size:22px; margin:0 0 4px; }
  .layer-tag{ display:inline-block; font-size:11px; padding:3px 10px; border-radius:999px; background:var(--cream); color:var(--teal-dark); font-weight:600; margin-bottom:14px; letter-spacing:.03em; }

  .scale{ display:flex; gap:8px; margin:18px 0 6px; flex-wrap:wrap; }
  .scale-opt{ flex:1; min-width:52px; text-align:center; padding:12px 4px; border-radius:10px; border:1.5px solid var(--line);
    cursor:pointer; font-size:13px; background:#fff; }
  .scale-opt.selected{ border-color:var(--teal-dark); background:var(--teal-dark); color:#fff; }
  .scale-labels{ display:flex; justify-content:space-between; font-size:11.5px; color:var(--ink-muted); margin-bottom:8px; }

  .freq-opt{ display:block; width:100%; text-align:left; padding:12px 14px; border-radius:10px; border:1.5px solid var(--line);
    background:#fff; margin-bottom:8px; cursor:pointer; font-size:14px; }
  .freq-opt.selected{ border-color:var(--terracota); background:#FBEFE9; font-weight:600; }

  .choice-opt{ display:block; width:100%; text-align:left; padding:14px 16px; border-radius:12px; border:1.5px solid var(--line);
    background:#fff; margin-bottom:10px; cursor:pointer; font-size:14px; line-height:1.4; }
  .choice-opt.selected{ border-color:var(--roxo); background:#F8EEF4; }

  textarea{ width:100%; min-height:90px; border-radius:10px; border:1.5px solid var(--line); padding:12px 14px;
    font-family:inherit; font-size:14px; resize:vertical; }
  textarea:focus, .freq-opt:focus, .choice-opt:focus{ outline:2px solid var(--teal); }

  .note{ background:var(--cream); border-left:3px solid var(--teal-dark); padding:12px 14px; border-radius:6px; font-size:13px; margin:14px 0; }
  .note.safety{ border-left-color:var(--crit); background:#FBEDED; }

  .status-chip{ display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; padding:4px 10px; border-radius:999px; }
  .legend{ display:flex; gap:16px; margin-bottom:14px; flex-wrap:wrap; }
  .legend-item{ display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-muted); }
  .legend-dot{ width:10px; height:10px; border-radius:3px; }

  .bar-row{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .bar-label{ width:190px; font-size:13px; flex-shrink:0; }
  .bar-track{ flex:1; height:14px; background:var(--line); border-radius:4px; overflow:hidden; }
  .bar-fill{ height:100%; border-radius:4px; }
  .bar-status{ width:78px; font-size:11.5px; text-align:right; font-weight:600; flex-shrink:0; }

  .service-chip{ display:inline-flex; flex-direction:column; gap:4px; padding:14px 16px; border-radius:12px; color:#fff; min-width:150px; }
  .service-row{ display:flex; gap:12px; flex-wrap:wrap; margin:14px 0; }

  .rh-toggle{ display:flex; gap:8px; margin-bottom:18px; }
  .rh-toggle button{ flex:1; }

  .qa-block{ margin-bottom:18px; padding-bottom:16px; border-bottom:1px solid var(--line); }
  .qa-block:last-child{ border-bottom:none; }

  ul.plain{ padding-left:18px; margin:8px 0; }
  ul.plain li{ margin-bottom:4px; font-size:14px; }

  .gate-wrap{ min-height:80vh; display:flex; align-items:center; justify-content:center; width:100%; }
  .gate-card{ max-width:360px; width:100%; }
  .gate-input{ width:100%; padding:12px 14px; border-radius:10px; border:1.5px solid var(--line); font-size:14px; margin:14px 0 6px; font-family:inherit; }
  .gate-input:focus{ outline:2px solid var(--teal); }
  .gate-error{ font-size:12.5px; color:var(--crit); min-height:18px; margin-bottom:8px; }

  .module-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(200px,1fr)); gap:14px; margin:18px 0 4px; }
  .app-card{ border:1.5px solid var(--line); border-radius:14px; padding:18px; background:#fff; cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease; }
  .app-card:hover{ transform:translateY(-2px); box-shadow:0 4px 14px rgba(0,0,0,.07); }
  .app-card.disabled{ cursor:default; }
  .app-card.disabled:hover{ transform:none; box-shadow:none; }
  .app-card .icon{ font-size:24px; display:block; margin-bottom:8px; }
  .badge{ display:inline-block; font-size:10.5px; padding:3px 9px; border-radius:999px; margin-top:10px; font-weight:600; letter-spacing:.02em; }
  .badge-ready{ background:#E6F4EC; color:#1E8F5F; }
  .badge-soon{ background:var(--cream); color:var(--ink-muted); }
  .toast{ background:var(--cream); border:1px solid var(--line); border-radius:10px; padding:10px 14px; margin-bottom:14px; font-size:13px; }
</style>
</head>
<body>
<div id="app">
  <div style="max-width:480px;margin:80px auto;padding:24px;text-align:center;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#5A5A5A;">
    Carregando o App Alegre-Ser…
    <br><br>

  </div>
</div>

let state = { screen:'home', moduleIndex:0, step:'sentir', answers:{}, unlocked:false, gateError:false, toastMsg:'' };

function initAnswers(){
  MODULES.forEach(m=>{ state.answers[m.id] = { sentir:null, contexto:[], forced:null, open:'', jdl:'', safeOpen:'', skipped:false, status:null, severity:null }; });
}
initAnswers();

/* ============================= LÓGICA ============================= */

function sentirSeverity(v){ return 5 - v; } // v:1..5 → severity 0..4 (5=leve→0 severidade)

function contextoSeverity(idx, invert){ return invert ? idx : (4-idx); } // idx 0..4 nas opções de FREQ

function computeStatus(avgSeverity){
  if(avgSeverity <= 1.2) return 'tranquilo';
  if(avgSeverity <= 2.5) return 'atencao';
  return 'critico';
}

function finalizeModule(mod){
  const a = state.answers[mod.id];
  if(mod.sensitive){
    // segurança: nunca "tranquilo automático" se sentir <=3, e nunca pontua "padrão pessoal"
    const sev = sentirSeverity(a.sentir);
    a.severity = sev;
    a.status = a.sentir <= 3 ? 'critico' : 'tranquilo';
    return;
  }
  if(a.skipped){ a.status='tranquilo'; a.severity=0; return; }
  const sevs = [sentirSeverity(a.sentir)];
  mod.contexto.forEach((c,i)=> sevs.push(contextoSeverity(a.contexto[i], c.invert)));
  const avg = sevs.reduce((x,y)=>x+y,0)/sevs.length;
  a.severity = avg;
  a.status = computeStatus(avg);
}

function tallyLeaning(){
  const t = { interno:0, externo:0, misto:0 };
  MODULES.forEach(m=>{
    if(m.sensitive) return;
    const a = state.answers[m.id];
    if(a.skipped || !a.forced) return;
    if(a.status === 'tranquilo') return;
    t[a.forced] = (t[a.forced]||0) + 1;
  });
  return t;
}

function leadershipFlag(){
  // módulos ligados a decisão/liderança/estrutura, quando "externo" e não tranquilos
  const ids = ['controle','inseguranca','comunicacao','gestao_mudancas','justica'];
  return ids.some(id=>{
    const a = state.answers[id];
    return a && !a.skipped && a.status!=='tranquilo' && a.forced==='externo';
  });
}

function recommendation(){
  const t = tallyLeaning();
  const recs = [];
  if(t.interno >= t.externo && t.interno > 0) recs.push('laboratorio');
  if(t.externo >= t.interno && t.externo > 0) recs.push(leadershipFlag() ? 'espiral' : 'ciranda');
  if(t.misto > 0 && recs.length < 2) recs.push('ciranda');
  if(recs.length===0) recs.push('laboratorio');
  return [...new Set(recs)];
}

function fillDemoAnswers(){
  MODULES.forEach(m=>{
    const a = state.answers[m.id];
    if(m.sensitive){
      a.sentir = 5; a.contexto = [0,4]; a.status='tranquilo'; a.severity=0;
      return;
    }
    const lowSentir = Math.random() < 0.55;
    a.sentir = lowSentir ? (1+Math.floor(Math.random()*2)) : (4+Math.floor(Math.random()*2));
    if(a.sentir >= 4){ a.skipped = true; }
    else{
      a.contexto = m.contexto.map(()=> Math.floor(Math.random()*5));
      const opts = m.forced.options;
      a.forced = opts[Math.floor(Math.random()*opts.length)].leaning;
      a.open = '(resposta de exemplo preenchida para demonstração)';
      a.jdl = '(resposta de exemplo preenchida para demonstração)';
    }
    finalizeModule(m);
  });
  state.screen = 'results';
}

function bindEvents(){
  app.querySelectorAll('[data-action]').forEach(el=>{
    el.addEventListener('click', onAction);
  });
  app.querySelectorAll('textarea[data-field]').forEach(el=>{
    el.addEventListener('input', e=>{
      const m = MODULES[state.moduleIndex];
      state.answers[m.id][e.target.dataset.field] = e.target.value;
    });
  });
  const gateInput = document.getElementById('gate-pass');
  if(gateInput){
    gateInput.focus();
    gateInput.addEventListener('keydown', e=>{ if(e.key==='Enter'){ doUnlock(); } });
  }
}

function doUnlock(){
  const el = document.getElementById('gate-pass');
  const val = el ? el.value : '';
  if(val === PASSWORD){ state.unlocked = true; state.gateError = false; render(); }
  else { state.gateError = true; render(); }
}

function goToModuleStep(step){ state.step = step; render(); }

function advanceAfterContexto(m,a){
  if(a.contexto.length < m.contexto.length){ render(); return; }
  finalizeModule(m);
  if(m.sensitive){ goToModuleStep('safe'); }
  else { goToModuleStep('forced'); }
}

function nextModuleOrResults(){
  if(state.moduleIndex < MODULES.length-1){
    state.moduleIndex++;
    state.step = 'sentir';
    render();
  } else {
    state.screen = 'results';
    render();
  }
}

function onAction(e){
  const action = e.currentTarget.dataset.action;
  const m = MODULES[state.moduleIndex];
  const a = state.answers ? state.answers[m ? m.id : null] : null;

  if(action==='unlock'){ doUnlock(); return; }
  if(action==='go-home'){ state.screen='home'; state.toastMsg=''; render(); return; }
  if(action==='open-diagnostico'){ state.screen='intro'; render(); return; }
  if(action==='placeholder'){
    state.toastMsg = `🛠️ "${e.currentTarget.dataset.name}" entra na próxima etapa do desenvolvimento — ainda não está pronto pra usar.`;
    render();
    return;
  }

  if(action==='start'){ state.screen='module'; state.moduleIndex=0; state.step='sentir'; render(); return; }
  if(action==='demo'){ fillDemoAnswers(); render(); return; }

  if(action==='sentir'){ a.sentir = parseInt(e.currentTarget.dataset.value,10); render(); return; }
  if(action==='next-sentir'){
    if(!m.sensitive && a.sentir >= 4){ a.skipped = true; finalizeModule(m); nextModuleOrResults(); return; }
    a.skipped = false;
    goToModuleStep('contexto');
    return;
  }

  if(action==='contexto'){
    a.contexto.push(parseInt(e.currentTarget.dataset.value,10));
    advanceAfterContexto(m,a);
    return;
  }
  if(action==='skip-contexto'){
    a.contexto.push(2); // valor neutro quando a pessoa prefere não responder
    advanceAfterContexto(m,a);
    return;
  }

  if(action==='forced'){ a.forced = e.currentTarget.dataset.value; render(); return; }
  if(action==='next-forced'){ goToModuleStep('open'); return; }
  if(action==='next-open'){ goToModuleStep('jdl'); return; }
  if(action==='next-jdl'){ nextModuleOrResults(); return; }
  if(action==='next-safe'){ nextModuleOrResults(); return; }

  if(action==='back'){
    if(state.step==='contexto' && a.contexto.length>0){ a.contexto.pop(); render(); return; }
    if(state.step==='contexto'){ goToModuleStep('sentir'); return; }
    if(state.step==='forced'){ goToModuleStep('sentir'); a.contexto=[]; return; }
    if(state.step==='open'){ goToModuleStep('forced'); return; }
    if(state.step==='jdl'){ goToModuleStep('open'); return; }
    if(state.step==='safe'){ goToModuleStep('sentir'); a.contexto=[]; return; }
    if(state.step==='sentir'){
      if(state.moduleIndex>0){ state.moduleIndex--; state.step='jdl'; const pm=MODULES[state.moduleIndex]; if(pm.sensitive) state.step='safe'; goToModuleStep(state.step); }
      return;
    }
  }

  if(action==='goto-rh'){ state.screen='rh'; render(); return; }
  if(action==='back-results'){ state.screen='results'; render(); return; }
  if(action==='restart'){
    state = { screen:'intro', moduleIndex:0, step:'sentir', answers:{}, unlocked:true, gateError:false, toastMsg:'' };
    initAnswers();
    render();
    return;
  }
}

render();
</script>
</body>
</html>
